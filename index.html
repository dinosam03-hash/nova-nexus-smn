<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMN — Sistema de Mensagens Nova Nexus</title>
  <style>
    :root{
      --bg:#050814; --panel:#0B1220; --panel2:#111827; --line:#1E293B;
      --text:#E5E7EB; --muted:#7C8AA5; --cyan:#22D3EE; --cyan2:#06B6D4;
      --green:#22C55E; --danger:#EF4444;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
    .app{display:flex;flex-direction:column;height:100vh}
    header{height:74px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
    .brand h1{font-size:28px;color:var(--cyan)}
    .brand span{font-size:12px;color:var(--muted)}
    .status{text-align:right;font-size:13px}
    .status .on{color:var(--green);font-weight:700}
    .status .off{color:var(--danger);font-weight:700}
    .status small{color:var(--muted);display:block;margin-top:2px}
    main{flex:1;display:grid;grid-template-columns:280px 1fr;min-height:0}
    aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow:auto}
    aside h2{font-size:12px;color:var(--muted);letter-spacing:1px;margin:12px 0 8px}
    .user-card{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px}
    .user-card b{color:var(--cyan)}
    .user-card p{color:var(--muted);font-size:12px;margin-top:4px}
    .channel,.member{width:100%;text-align:left;background:#152033;color:var(--text);border:none;border-radius:12px;padding:10px 12px;margin:4px 0;cursor:pointer;font-size:14px}
    .channel:hover{background:#1E293B}
    .channel.active{background:#0E4A5A;color:var(--cyan);border:1px solid #155E75}
    .chat-wrap{display:flex;flex-direction:column;min-height:0;background:#070B16}
    .chat-top{padding:12px 16px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .chat-top h3{font-size:15px}
    .chat-top span{color:var(--muted);font-size:12px}
    #messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
    .msg{max-width:min(720px,92%);background:#0F172A;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
    .msg.me{align-self:flex-end;background:#0B3A4A;border-color:#155E75}
    .msg .meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);margin-bottom:6px}
    .msg .meta b{color:var(--cyan)}
    .msg.me .meta b{color:#A5F3FC}
    .msg .text{white-space:pre-wrap;line-height:1.45;font-size:14px}
    .msg img.preview{max-width:min(280px,100%);border-radius:12px;margin-top:8px;display:block}
    .msg .arquivo,.msg .audio-box{
      margin-top:8px;padding:10px 12px;background:#152033;border:1px solid #1E293B;
      border-radius:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap
    }
    .msg .arquivo a{color:#67E8F9;text-decoration:none;word-break:break-all}
    .msg audio{width:min(260px,100%);margin-top:6px}
    .reacoes{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
    .reacoes button{background:#152033;border:1px solid #1E293B;color:#E5E7EB;border-radius:10px;padding:4px 8px;cursor:pointer;font-size:12px}
    .reacoes button:hover{background:#1E293B}
    .btn-del{margin-left:auto;background:transparent;border:1px solid #7F1D1D;color:#FCA5A5;border-radius:10px;padding:4px 8px;cursor:pointer;font-size:11px}
    .btn-del:hover{background:#7F1D1D;color:#fff}
    .composer{display:flex;gap:8px;padding:14px;background:var(--panel);border-top:1px solid var(--line);align-items:center}
    .composer input[type="text"]{
      flex:1;height:48px;border-radius:14px;border:1px solid var(--line);
      background:#0F172A;color:var(--text);padding:0 14px;font-size:14px;outline:none
    }
    .composer input:focus{border-color:#155E75}
    .composer button{
      height:48px;min-width:48px;border:none;border-radius:14px;
      background:#152033;color:var(--cyan);font-weight:700;cursor:pointer;padding:0 12px
    }
    .composer button.primary{background:var(--cyan2);color:#042F2E;min-width:110px}
    .composer button:disabled{opacity:.5;cursor:not-allowed}
    .composer button.rec-on{background:#7F1D1D;color:#FECACA}
    #typingIndicator{min-height:28px;padding:0 18px;display:flex;align-items:center;gap:8px;color:#22D3EE;font-size:13px}
    .typing-dots{display:flex;gap:4px}
    .typing-dots span{width:8px;height:8px;border-radius:50%;background:#22D3EE;animation:pulse 1s infinite}
    .typing-dots span:nth-child(2){animation-delay:.2s}
    .typing-dots span:nth-child(3){animation-delay:.4s}
    @keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
    #login{position:fixed;inset:0;background:rgba(5,8,20,.92);display:flex;align-items:center;justify-content:center;z-index:20}
    .login-card{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 0 40px rgba(34,211,238,.08)}
    .login-card h2{color:var(--cyan);font-size:26px;margin-bottom:6px}
    .login-card p{color:var(--muted);font-size:13px;margin-bottom:18px}
    .login-card label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
    .login-card input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:#0F172A;color:var(--text);padding:0 12px;font-size:14px}
    .login-card button{width:100%;height:48px;margin-top:18px;border:none;border-radius:14px;background:var(--cyan2);color:#042F2E;font-weight:800;cursor:pointer;font-size:15px}
    .erro{color:#FCA5A5;font-size:13px;margin-top:10px;min-height:18px}
    .sys{align-self:center;color:var(--muted);font-size:12px;padding:4px 8px}
    .modal{
      position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:30
    }
    .modal.open{display:flex}
    .modal-card{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
    .modal-card h3{color:var(--cyan);margin-bottom:10px}
    .modal-card input{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:#0F172A;color:var(--text);padding:0 12px;margin:8px 0}
    .modal-card .row{display:flex;gap:8px;margin-top:12px}
    .modal-card .row button{flex:1;height:42px;border:none;border-radius:10px;cursor:pointer;font-weight:700}
    .modal-card .ok{background:var(--cyan2);color:#042F2E}
    .modal-card .cancel{background:#152033;color:var(--text)}
    @media (max-width:860px){main{grid-template-columns:1fr}aside{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>SMN</h1>
        <span>Sistema de Mensagens • Nova Nexus</span>
      </div>
      <div class="status">
        <div id="conn" class="off">● OFFLINE</div>
        <small id="who">Não autenticado</small>
      </div>
    </header>

    <main>
      <aside>
        <div class="user-card">
          <div>Operador: <b id="sideName">—</b></div>
          <p id="sideCargo">Cargo: —</p>
        </div>
        <h2>CANAIS</h2>
        <button class="channel active" data-canal="geral"># geral</button>
        <button class="channel" data-canal="comandantes"># comandantes</button>
        <button class="channel" data-canal="alertas"># alertas</button>
        <button class="channel" data-canal="justica"># justiça</button>
        <button class="channel" data-canal="pilares"># pilares</button>
        <h2>ONLINE</h2>
        <div id="onlineList"><p style="color:#7C8AA5;font-size:13px">Aguardando...</p></div>
      </aside>

      <section class="chat-wrap">
        <div class="chat-top">
          <h3 id="canalTitulo"># geral</h3>
          <span>Mensagens em tempo real</span>
        </div>
        <div id="messages"></div>
        <div id="typingIndicator"></div>
        <div class="composer">
          <input type="file" id="imgInput" accept="image/*" hidden />
          <button type="button" id="btnLink" title="Link de arquivo">🔗</button>
          <button type="button" id="btnImg" title="Imagem leve">🖼️</button>
          <button type="button" id="btnAudio" title="Áudio">🎙️</button>
          <input id="msgInput" type="text" placeholder="Escreve sua mensagem..." maxlength="500" disabled />
          <button id="btnSend" class="primary" disabled>ENVIAR</button>
        </div>
      </section>
    </main>
  </div>

  <div id="login">
    <div class="login-card">
      <h2>NEXIA // SMN</h2>
      <p>Nome oficial + senha individual.</p>
      <label>Nome</label>
      <input id="nome" list="listaMembros" placeholder="Ex: Samuel" />
      <datalist id="listaMembros"></datalist>
      <label>Senha individual</label>
      <input id="senha" type="password" placeholder="sua senha" />
      <button id="btnLogin">ENTRAR NO SMN</button>
      <div class="erro" id="loginErro"></div>
    </div>
  </div>

  <div class="modal" id="modalLink">
    <div class="modal-card">
      <h3>Enviar link de arquivo</h3>
      <p style="color:#7C8AA5;font-size:13px;margin-bottom:6px">Google Drive, MediaFire, etc. (link público)</p>
      <input id="linkUrl" placeholder="https://..." />
      <input id="linkNome" placeholder="Nome do arquivo (opcional)" />
      <div class="row">
        <button class="cancel" id="linkCancel">Cancelar</button>
        <button class="ok" id="linkOk">Enviar</button>
      </div>
    </div>
  </div>

  <script type="module">
    const firebaseConfig = {
      apiKey: "AIzaSyD1YbeRE0XMD4HZn-3hulQYuHa10nXFeoQ",
      authDomain: "nova-nexus-smn.firebaseapp.com",
      databaseURL: "https://nova-nexus-smn-default-rtdb.firebaseio.com",
      projectId: "nova-nexus-smn",
      storageBucket: "nova-nexus-smn.firebasestorage.app",
      messagingSenderId: "1067337138111",
      appId: "1:1067337138111:web:f04a9afc96892ec9a3ab0a"
    };

    const MEMBROS = {
      "samuel": { cargo: "Supremo Comandante", senha: "k9p2xm", pilar: true },
      "leonardo": { cargo: "Comandante de Frota", senha: "q7m4vz", pilar: true },
      "talles": { cargo: "Coadjutor Geral", senha: "r3n8wp", pilar: true },
      "maria clara": { cargo: "Comandante", senha: "h6t1kc" },
      "brenno": { cargo: "Comandante", senha: "f5j7nd" },
      "juan": { cargo: "Comandante", senha: "m8c3ys" },
      "lucas": { cargo: "Comandante", senha: "p4w6tr" },
      "noah": { cargo: "Comandante", senha: "z1a9ue" },
      "gabriel coutinho": { cargo: "Comandante", senha: "d7k2hs" },
      "rafael": { cargo: "Comandante", senha: "v5n8qm" },
      "ana leticia": { cargo: "Capitão", senha: "g3y6pb" },
      "ana letícia": { cargo: "Capitão", senha: "g3y6pb" },
      "luana": { cargo: "Capitão", senha: "c9r4wx" },
      "gabriela": { cargo: "Capitão", senha: "t2m7kf" },
      "lais": { cargo: "Capitão", senha: "n6h1jq" },
      "laís": { cargo: "Capitão", senha: "n6h1jq" },
      "theo": { cargo: "Diretor", senha: "w8s3ld" },
      "théo": { cargo: "Diretor", senha: "w8s3ld" },
      "manuella": { cargo: "Diretor", senha: "a4p9ve" },
      "davi": { cargo: "Diretor", senha: "y7c2nm" },
      "gael": { cargo: "Capitão", senha: "s5k8xr" },
      "esmael": { cargo: "Diretor", senha: "j1f6qt" },
      "pietra": { cargo: "Capitão", senha: "u3b7hw" },
      "vitoria": { cargo: "Capitão", senha: "e9m4zc" },
      "vitória": { cargo: "Capitão", senha: "e9m4zc" },
      "enri": { cargo: "Diretor", senha: "l2q5ky" },
      "lorena gomes": { cargo: "Capitão", senha: "x6t8pr" },
      "maria eduarda": { cargo: "Capitão", senha: "o4n1gs" },
      "maria alicia": { cargo: "Diretor", senha: "i8w3df" },
      "maria alícia": { cargo: "Diretor", senha: "i8w3df" },
      "lorenzo ricardo": { cargo: "Capitão", senha: "h5v9ma" },
      "luiz": { cargo: "Diretor", senha: "r7c2pk" },
      "mateo": { cargo: "Diretor", senha: "q9j4tn" },
      "caio": { cargo: "Diretor", senha: "z3l6wb" },
      "ezequiel": { cargo: "Diretor", senha: "m1s8ye" },
      "rebecca": { cargo: "Diretor", senha: "k4d7ux" },
      "laura": { cargo: "Diretor", senha: "p6h2nf" }
    };

    const EXPULSOS = new Set(["maria canto"]);
    const EMOJIS = ["🔥", "🛡️", "✅", "💀"];
    const MAX_IMG_KB = 350;
    const MAX_AUDIO_SEC = 20;

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase, ref, push, onChildAdded, onChildChanged, onChildRemoved,
      set, onValue, get, onDisconnect, remove, query, limitToLast
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let user = null;
    let canalAtual = "geral";
    let unsubAdded = null, unsubChanged = null, unsubRemoved = null, unsubTyping = null;
    let typingTimeout = null;
    let unread = 0;
    let mediaRecorder = null;
    let audioChunks = [];
    let gravando = false;
    const msgNodes = new Map();

    const audioMsg = new Audio("https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg");

    const el = {
      login: document.getElementById("login"),
      nome: document.getElementById("nome"),
      senha: document.getElementById("senha"),
      loginErro: document.getElementById("loginErro"),
      btnLogin: document.getElementById("btnLogin"),
      messages: document.getElementById("messages"),
      msgInput: document.getElementById("msgInput"),
      btnSend: document.getElementById("btnSend"),
      btnLink: document.getElementById("btnLink"),
      btnImg: document.getElementById("btnImg"),
      btnAudio: document.getElementById("btnAudio"),
      imgInput: document.getElementById("imgInput"),
      conn: document.getElementById("conn"),
      who: document.getElementById("who"),
      sideName: document.getElementById("sideName"),
      sideCargo: document.getElementById("sideCargo"),
      canalTitulo: document.getElementById("canalTitulo"),
      onlineList: document.getElementById("onlineList"),
      typingIndicator: document.getElementById("typingIndicator"),
      listaMembros: document.getElementById("listaMembros"),
      modalLink: document.getElementById("modalLink"),
      linkUrl: document.getElementById("linkUrl"),
      linkNome: document.getElementById("linkNome"),
      linkOk: document.getElementById("linkOk"),
      linkCancel: document.getElementById("linkCancel"),
    };

    Object.keys(MEMBROS).forEach(n => {
      const opt = document.createElement("option");
      opt.value = n.replace(/\b\w/g, c => c.toUpperCase());
      el.listaMembros.appendChild(opt);
    });

    function norm(s){
      return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().replace(/\s+/g," ");
    }
    function setOnlineUI(on){
      el.conn.className = on ? "on" : "off";
      el.conn.textContent = on ? "● ONLINE" : "● OFFLINE";
    }
    function escapeHtml(str){
      return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
    }
    function formatHora(ts){
      try{ return new Date(typeof ts==="number"?ts:Date.now()).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }
      catch{ return "--:--"; }
    }
    function playMsgSound(){
      try{ audioMsg.currentTime=0; audioMsg.volume=0.3; audioMsg.play().catch(()=>{}); }catch{}
    }
    function setTitleBadge(){
      document.title = unread>0 ? `(${unread}) SMN — Nova Nexus` : "SMN — Sistema de Mensagens Nova Nexus";
    }
    window.addEventListener("focus", ()=>{ unread=0; setTitleBadge(); });
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ unread=0; setTitleBadge(); }});

    function podeApagar(m){ return !!(user && m && (m.uid===user.uid || user.pilar)); }

    function renderReacoes(m, key){
      const reacoes = m.reacoes || {};
      let html = EMOJIS.map(e => `<button data-react="${e}" data-key="${escapeHtml(key)}">${e} ${reacoes[e]||0}</button>`).join("");
      if (podeApagar(m)) html += `<button class="btn-del" data-del="${escapeHtml(key)}">apagar</button>`;
      return html;
    }

    function buildMsgHtml(m, key){
      let corpo = "";
      if (m.texto) corpo += `<div class="text">${escapeHtml(m.texto)}</div>`;
      if (m.link && m.link.url) {
        corpo += `<div class="arquivo"><span>🔗</span><a href="${escapeHtml(m.link.url)}" target="_blank" rel="noopener">${escapeHtml(m.link.nome||m.link.url)}</a></div>`;
      }
      if (m.imagem) {
        corpo += `<img class="preview" src="${m.imagem}" alt="imagem" />`;
      }
      if (m.audio) {
        corpo += `<div class="audio-box"><span>🎙️</span><audio controls src="${m.audio}"></audio></div>`;
      }
      if (!corpo) corpo = `<div class="text" style="color:#7C8AA5">(vazio)</div>`;
      return `
        <div class="meta">
          <b>${escapeHtml(m.nome||"?")} <span style="color:#7C8AA5;font-weight:500">• ${escapeHtml(m.cargo||"")}</span></b>
          <span>${formatHora(m.createdAt)}</span>
        </div>
        ${corpo}
        <div class="reacoes">${renderReacoes(m,key)}</div>`;
    }

    function bindMsgButtons(div, m, key){
      div.querySelectorAll("[data-react]").forEach(btn=>{
        btn.onclick = () => reagir(key, btn.getAttribute("data-react"));
      });
      const del = div.querySelector("[data-del]");
      if (del) del.onclick = () => apagarMsg(key);
    }

    function upsertMsg(m, key, isNew){
      if (!m) return;
      const mine = !!(user && m.uid === user.uid);
      let div = msgNodes.get(key);
      if (!div) {
        div = document.createElement("div");
        div.className = "msg" + (mine ? " me" : "");
        el.messages.appendChild(div);
        msgNodes.set(key, div);
        if (isNew && !mine && (document.hidden || !document.hasFocus())) {
          unread++; setTitleBadge(); playMsgSound();
        }
      } else {
        div.className = "msg" + (mine ? " me" : "");
      }
      div.innerHTML = buildMsgHtml(m, key);
      bindMsgButtons(div, m, key);
      el.messages.scrollTop = el.messages.scrollHeight;
    }

    function removeMsgNode(key){
      const div = msgNodes.get(key);
      if (div){ div.remove(); msgNodes.delete(key); }
    }

    function addSys(t){
      const d=document.createElement("div"); d.className="sys"; d.textContent=t;
      el.messages.appendChild(d); el.messages.scrollTop=el.messages.scrollHeight;
    }

    async function reagir(msgKey, emoji){
      if (!user) return;
      const r = ref(db, `smn/canais/${canalAtual}/msgs/${msgKey}/reacoes/${emoji}`);
      const snap = await get(r);
      await set(r, (snap.exists()?Number(snap.val())||0:0)+1);
    }
    async function apagarMsg(msgKey){
      if (!user || !confirm("Apagar esta mensagem?")) return;
      await remove(ref(db, `smn/canais/${canalAtual}/msgs/${msgKey}`));
    }

    function clearListeners(){
      if(unsubAdded) unsubAdded(); if(unsubChanged) unsubChanged();
      if(unsubRemoved) unsubRemoved(); if(unsubTyping) unsubTyping();
      unsubAdded=unsubChanged=unsubRemoved=unsubTyping=null;
    }

    function listenCanal(canal){
      clearListeners(); msgNodes.clear(); el.messages.innerHTML=""; el.typingIndicator.innerHTML="";
      addSys(`Conectado em #${canal}`);
      const q = query(ref(db, `smn/canais/${canal}/msgs`), limitToLast(80));
      unsubAdded = onChildAdded(q, snap => upsertMsg(snap.val(), snap.key, true));
      unsubChanged = onChildChanged(q, snap => upsertMsg(snap.val(), snap.key, false));
      unsubRemoved = onChildRemoved(q, snap => removeMsgNode(snap.key));
      setupTyping(canal);
    }

    function setupPresence(){
      const myRef = ref(db, `smn/online/${user.uid}`);
      set(myRef, { nome:user.nome, cargo:user.cargo, at:Date.now() });
      onDisconnect(myRef).remove();
      onValue(ref(db,"smn/online"), snap=>{
        const arr = Object.values(snap.val()||{}).sort((a,b)=>(a.nome||"").localeCompare(b.nome||""));
        el.onlineList.innerHTML = arr.length
          ? arr.map(p=>`<div class="member" style="cursor:default">🟢 ${escapeHtml(p.nome)} <span style="color:#7C8AA5">• ${escapeHtml(p.cargo||"")}</span></div>`).join("")
          : `<p style="color:#7C8AA5;font-size:13px">Ninguém online</p>`;
      });
    }

    function setupTyping(canal){
      if (unsubTyping) unsubTyping();
      const typingRef = ref(db, `smn/typing/${canal}/${user.uid}`);
      el.msgInput.oninput = () => {
        set(typingRef, { nome:user.nome, at:Date.now() });
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(()=>remove(typingRef), 1800);
      };
      unsubTyping = onValue(ref(db, `smn/typing/${canal}`), snap=>{
        const outros = Object.values(snap.val()||{}).filter(p=>p && p.nome!==user.nome);
        if(!outros.length){ el.typingIndicator.innerHTML=""; return; }
        el.typingIndicator.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>
          <span>${escapeHtml(outros.map(o=>o.nome).slice(0,3).join(", "))} ${outros.length>1?"estão":"está"} digitando...</span>`;
      });
    }

    async function pushMsg(extra={}){
      if (!user) return;
      if (canalAtual==="pilares" && !user.pilar){ alert("Canal #pilares só para Pilares."); return; }
      await push(ref(db, `smn/canais/${canalAtual}/msgs`), {
        uid:user.uid, nome:user.nome, cargo:user.cargo,
        texto: extra.texto || "",
        link: extra.link || null,
        imagem: extra.imagem || null,
        audio: extra.audio || null,
        createdAt: Date.now(),
        reacoes: {}
      });
    }

    async function sendMsg(){
      const texto = el.msgInput.value.trim();
      if (!texto) return;
      el.msgInput.value = "";
      remove(ref(db, `smn/typing/${canalAtual}/${user.uid}`));
      await pushMsg({ texto });
    }

    // LINK
    el.btnLink.onclick = () => { if(user) el.modalLink.classList.add("open"); };
    el.linkCancel.onclick = () => el.modalLink.classList.remove("open");
    el.linkOk.onclick = async () => {
      const url = el.linkUrl.value.trim();
      if (!/^https?:\/\//i.test(url)) { alert("Link inválido. Use http/https."); return; }
      await pushMsg({
        texto: el.msgInput.value.trim(),
        link: { url, nome: el.linkNome.value.trim() || url }
      });
      el.msgInput.value = "";
      el.linkUrl.value = ""; el.linkNome.value = "";
      el.modalLink.classList.remove("open");
    };

    // IMAGEM leve
    el.btnImg.onclick = () => { if(user) el.imgInput.click(); };
    el.imgInput.onchange = () => {
      const file = el.imgInput.files?.[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) { alert("Só imagem."); return; }
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = async () => {
          const scale = Math.min(1, 800 / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          let quality = 0.72;
          let data = canvas.toDataURL("image/jpeg", quality);
          while (data.length > MAX_IMG_KB * 1024 * 1.37 && quality > 0.4) {
            quality -= 0.08;
            data = canvas.toDataURL("image/jpeg", quality);
          }
          if (data.length > MAX_IMG_KB * 1024 * 1.4) {
            alert("Imagem ainda grande. Tenta outra mais leve.");
            return;
          }
          await pushMsg({ texto: el.msgInput.value.trim(), imagem: data });
          el.msgInput.value = "";
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
      el.imgInput.value = "";
    };

    // ÁUDIO
    async function toggleAudio(){
      if (!user) return;
      if (!gravando) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            const blob = new Blob(audioChunks, { type: "audio/webm" });
            if (blob.size > 900000) { alert("Áudio muito grande. Grava mais curto."); return; }
            const reader = new FileReader();
            reader.onloadend = async () => {
              await pushMsg({ texto: "", audio: reader.result });
            };
            reader.readAsDataURL(blob);
          };
          mediaRecorder.start();
          gravando = true;
          el.btnAudio.classList.add("rec-on");
          el.btnAudio.textContent = "⏹️";
          setTimeout(() => { if (gravando) stopAudio(); }, MAX_AUDIO_SEC * 1000);
        } catch {
          alert("Não deu pra usar o microfone. Permite o acesso.");
        }
      } else stopAudio();
    }
    function stopAudio(){
      if (mediaRecorder && gravando) {
        mediaRecorder.stop();
        gravando = false;
        el.btnAudio.classList.remove("rec-on");
        el.btnAudio.textContent = "🎙️";
      }
    }
    el.btnAudio.onclick = toggleAudio;

    function login(){
      const nomeDigitado = el.nome.value.trim();
      const senha = el.senha.value;
      el.loginErro.textContent = "";
      const key = norm(nomeDigitado);
      if (EXPULSOS.has(key)) {
        el.loginErro.textContent = "Acesso negado. Membro removido da Nova Nexus.";
        return;
      }
      let conta = MEMBROS[key];
      if (!conta) {
        const found = Object.entries(MEMBROS).find(([k]) => norm(k) === key);
        if (found) conta = found[1];
      }
      if (!conta) { el.loginErro.textContent = "Membro não encontrado."; return; }
      if (senha !== conta.senha) { el.loginErro.textContent = "Senha incorreta."; return; }

      user = {
        uid: key.replace(/\s+/g,"-"),
        nome: nomeDigitado.replace(/\b\w/g, c => c.toUpperCase()),
        cargo: conta.cargo,
        pilar: !!conta.pilar
      };
      localStorage.setItem("smn_user", JSON.stringify({ nome: user.nome }));
      el.login.style.display = "none";
      el.msgInput.disabled = false;
      el.btnSend.disabled = false;
      el.sideName.textContent = user.nome;
      el.sideCargo.textContent = "Cargo: " + user.cargo;
      el.who.textContent = user.nome + " • " + user.cargo;
      setOnlineUI(true);
      setupPresence();
      listenCanal(canalAtual);
      el.msgInput.focus();
    }

    document.querySelectorAll(".channel").forEach(btn => {
      btn.addEventListener("click", () => {
        const canal = btn.dataset.canal;
        if (canal==="pilares" && user && !user.pilar){ alert("Só Pilares."); return; }
        document.querySelectorAll(".channel").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        canalAtual = canal;
        el.canalTitulo.textContent = "# " + canal;
        if (user) listenCanal(canal);
      });
    });

    el.btnLogin.onclick = login;
    el.senha.addEventListener("keydown", e => { if(e.key==="Enter") login(); });
    el.nome.addEventListener("keydown", e => { if(e.key==="Enter") login(); });
    el.btnSend.onclick = sendMsg;
    el.msgInput.addEventListener("keydown", e => { if(e.key==="Enter") sendMsg(); });

    try{
      const saved = JSON.parse(localStorage.getItem("smn_user")||"null");
      if (saved?.nome) el.nome.value = saved.nome;
    }catch{}
  </script>
</body>
</html>
